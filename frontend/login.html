<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RationFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f1f5f9;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            color: #166534;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #15803d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #166534;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #b91c1c;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="logo">🌾</div>

        <h1>RationFlow</h1>
        <p class="subtitle">Ration Shop Management System</p>

        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"
                required>

            <button type="submit">Login</button>

            <p class="message" id="message" role="alert"></p>
        </form>

        <p class="footer">Secure access to your shop records</p>
    </main>


    <script>
        document.getElementById("login-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");
            const button = this.querySelector("button[type='submit']");

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Logging in...";

            try {
                const response = await fetch(`${window.location.protocol}//${window.location.hostname}:8080/api/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Login successful! Opening dashboard...";
                    window.location.href = "index.html";
                } else {
                    message.textContent = data.message || "Invalid username or password.";
                }

            } catch (error) {
                message.textContent = "Backend connect nahi ho raha. Check karo ki Spring Boot running hai.";
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>

</body>

</html>
